name: Apply CMS update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[CMS]')
    runs-on: ubuntu-latest
    steps:
      - name: Apply site content update
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/\`\`\`json\s*([\s\S]*?)\s*\`\`\`/i);
            if (!match) {
              core.setFailed('No JSON payload found');
              return;
            }
            let data;
            try { data = JSON.parse(match[1]); }
            catch (e) { core.setFailed('Invalid JSON payload: ' + e.message); return; }

            const allowed = ['brand','umrahGuide','hajjGuide','pastTrips'];
            const clean = {};
            for (const key of allowed) if (Object.prototype.hasOwnProperty.call(data,key)) clean[key]=data[key];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'data/site-content.json';
            const current = await github.rest.repos.getContent({owner,repo,path,ref:'main'});
            const content = Buffer.from(JSON.stringify(clean,null,2),'utf8').toString('base64');

            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,
              message:'Update site content from admin panel',
              content,
              sha: current.data.sha,
              branch:'main'
            });

            await github.rest.issues.createComment({
              owner,repo,issue_number:context.issue.number,
              body:'✅ تم تحديث محتوى الموقع ونشره على الفرع الرئيسي.'
            });
            await github.rest.issues.update({
              owner,repo,issue_number:context.issue.number,state:'closed'
            });

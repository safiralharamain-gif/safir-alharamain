name: Preview BVH Natural Walk

on:
  push:
    branches:
      - hajj-umrah-game-v13
    paths:
      - "game-v13/prepare_bvh_walk_preview.py"
      - "game-v13/render_motion_qa.py"
      - ".github/workflows/preview-bvh-walk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils libgl1 libegl1 libx11-6 libxkbcommon0 libxcursor1 libxinerama1 libxi6 libxrandr2

      - name: Download Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools out
          cd tools
          BASE="https://download.blender.org/release/Blender4.5/"
          INDEX="$(curl -fsSL "$BASE")"
          FILE="$(printf '%s' "$INDEX" | grep -oE 'blender-4\.5\.[0-9]+-linux-x64\.tar\.xz' | sort -V | tail -n1)"
          curl -fL "${BASE}${FILE}" -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER="$(find "$PWD" -maxdepth 2 -type f -name blender | head -n1)"
          chmod +x "$BLENDER"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

      - name: Download MakeHuman and walk BVH
        shell: bash
        run: |
          set -euo pipefail
          cd tools
          curl -fL "https://files.makehumancommunity.org/plugins/mpfb2-latest.zip" -o mpfb2.zip
          curl -fL "https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip" -o makehuman_assets.zip
          curl -fL "https://files2.makehumancommunity.org/asset_packs/bodyparts05/bodyparts05_cc0.zip" -o beards.zip
          mkdir -p makehuman_assets beard_assets
          unzip -q makehuman_assets.zip -d makehuman_assets
          unzip -q beards.zip -d beard_assets
          curl -fL "https://raw.githubusercontent.com/kunalkushwaha/vsim/main/scripts/blender/make-human.py" -o make-human.py
          curl -fL "https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/animations/walks/walk1.bvh" -o walk1.bvh
          python3 -c 'import pathlib; p=pathlib.Path("make-human.py"); s=p.read_text(encoding="utf-8"); reps=[("Spine1","Spine3"),("Spine","Spine2"),("LowerBack","Spine1"),("LeftShoulder","Clavicle_L"),("LeftArm","UpArm_L"),("LeftForeArm","LoArm_L"),("LeftHand","Hand_L"),("RightShoulder","Clavicle_R"),("RightArm","UpArm_R"),("RightForeArm","LoArm_R"),("RightHand","Hand_R"),("LeftUpLeg","UpLeg_L"),("LeftLeg","LoLeg_L"),("LeftFoot","Foot_L"),("LeftToeBase","Toe_L"),("RightUpLeg","UpLeg_R"),("RightLeg","LoLeg_R"),("RightFoot","Foot_R"),("RightToeBase","Toe_R")]; [None for a,b in reps if not (s:=s.replace(chr(34)+a+chr(34),chr(34)+b+chr(34)))]; p.write_text(s,encoding="utf-8")'
          BASE_SKIN="$(find makehuman_assets -type f -name 'young_caucasian_male.mhmat' -print -quit)"
          H1="$(find makehuman_assets -type f -name 'short01.mhclo' -print -quit)"
          BEARD="$(find beard_assets -type f -iname 'wdg_scruffy_beard.mhclo' -print -quit)"
          [ -n "$BEARD" ] || BEARD="$(find beard_assets -type f -iname '*beard*.mhclo' -print -quit)"
          C3="$(find makehuman_assets -type f -iname 'male_casualsuit03.mhclo' -print -quit)"
          { echo "BASE_SKIN=$PWD/$BASE_SKIN"; echo "H1=$PWD/$H1"; echo "BEARD=$PWD/$BEARD"; echo "C3=$PWD/$C3"; } >> "$GITHUB_ENV"

      - name: Generate player with imported BVH
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          COMMON=("gender=1.0" "age=0.47" "muscle=0.58" "weight=0.50" "height=0.56" "proportions=0.57" "caucasian=0.64" "african=0.26" "asian=0.10" "tex=1024")
          "$BLENDER" --background --python-exit-code 1 --python "$ROOT/tools/make-human.py" -- "$ROOT/tools/mpfb2.zip" "$ROOT/out/player_raw.glb" "$BASE_SKIN" "$H1" "$BEARD" "$C3" "$ROOT/tools/walk1.bvh" "${COMMON[@]}"

      - name: Prepare in-place BVH walk and preserve hand solution
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          "$BLENDER" --background --python-exit-code 1 --python "$ROOT/game-v13/prepare_bvh_walk_preview.py" -- "$ROOT/out/player_raw.glb" "$ROOT/out/player_bvh_walk.glb"

      - name: Render walk QA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          mkdir -p "$ROOT/out/motion-qa"
          "$BLENDER" --background --python-exit-code 1 --python "$ROOT/game-v13/render_motion_qa.py" -- "$ROOT/out/player_bvh_walk.glb" "$ROOT/out/player_bvh_walk.glb" "$ROOT/out/player_bvh_walk.glb" "$ROOT/out/motion-qa"

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: BVH-natural-walk-preview
          path: |
            out/player_bvh_walk.glb
            out/motion-qa/*.png
          if-no-files-found: error
          compression-level: 0
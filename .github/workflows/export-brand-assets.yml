name: Export original Safir brand image assets

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload original portrait and logo files
        uses: actions/upload-artifact@v4
        with:
          name: safir-authentic-logo-portrait
          path: |
            img/ahmed-sherif.png
            img/logo.png
          if-no-files-found: error

databases:
  - name: safir-haramain-cms-db

services:
  - type: web
    name: safir-haramain-cms
    runtime: node
    rootDir: cms-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safir-haramain-cms-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://safiralharamain.com,https://safiralharamain-gif.github.io

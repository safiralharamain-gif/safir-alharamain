<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سفير الحرمين - معاينة مطابقة للموقع الأصلي</title>
</head>
<body>
<script>
(async function () {
  try {
    const res = await fetch('../index.html', {cache: 'no-store'});
    let html = await res.text();

    // Force all original relative CSS/JS/images/fonts/pages to resolve from repo root.
    html = html.replace(/<head([^>]*)>/i, '<head$1><base href="../"><link rel="stylesheet" href="preview-v2/live-content.css">');

    // Keep preview navigation inside the V2 shell when returning to home.
    html = html.replace(/href="index\.html"/g, 'href="preview-v2/index.html"');

    html = html.replace(/<\/body>/i, '<script src="preview-v2/live-content.js"><\\/script></body>');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div style="font-family:Tahoma;padding:40px;text-align:center">تعذر تحميل نسخة المعاينة. جرّب تحديث الصفحة.</div>';
  }
})();
</script>
</body>
</html>

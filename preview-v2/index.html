<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سفير الحرمين - معاينة مطابقة للموقع الأصلي</title>
</head>
<body>
<script>
(async function () {
  try {
    const res = await fetch('../index.html', {cache: 'no-store'});
    let html = await res.text();

    // Use the exact original site CSS, fonts, images and scripts from repository root.
    html = html.replace(/<head([^>]*)>/i, '<head$1><base href="../"><link rel="stylesheet" href="preview-v2/live-content.css">');

    // Keep Home links inside Preview V2.
    html = html.replace(/href="index\\.html"/g, 'href="preview-v2/index.html"');

    // Inject Preview V2 dynamic content loader safely.
    const liveScript = '<scr' + 'ipt src="preview-v2/live-content.js?v=' + Date.now() + '"></scr' + 'ipt>';
    const adminButton = '<a href="preview-v2/admin/" style="position:fixed;left:18px;bottom:18px;z-index:99999;background:#be944a;color:#fff;padding:11px 16px;border-radius:999px;text-decoration:none;font-family:Tahoma,Arial,sans-serif;box-shadow:0 8px 25px rgba(0,0,0,.2)">إدارة الموقع</a>';
    html = html.replace(/<\/body>/i, liveScript + adminButton + '</body>');

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div style="font-family:Tahoma;padding:40px;text-align:center">تعذر تحميل نسخة المعاينة. جرّب تحديث الصفحة.</div>';
  }
})();
</script>
</body>
</html>

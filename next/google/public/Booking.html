<!doctype html><html lang="ar" dir="rtl"><head><base target="_top"><meta charset="UTF-8"><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f9f6ef;color:#22483c;margin:0}.wrap{max-width:630px;margin:25px auto;padding:22px;background:#fff;border-radius:15px;box-shadow:0 10px 35px #1233}h1{font-size:24px}label{display:block;font-weight:600;margin:14px 0}input,select,textarea{width:100%;padding:12px;font:inherit;border:1px solid #cfd9d3;border-radius:8px;margin-top:5px}.check{display:flex;gap:9px;align-items:start;font-weight:normal}.check input{width:auto}button,.wa{background:#125744;color:white;border:0;border-radius:8px;padding:13px 18px;cursor:pointer;font:inherit;display:inline-block;text-decoration:none}.wa{background:#18834c}#message{margin-top:14px}</style></head><body><div class="wrap"><h1>طلب حجز — سفير الحرمين</h1><p>سنتواصل معك لتأكيد التفاصيل. إرسال الطلب لا يعني تأكيد حجز أو دفع.</p>
<form id="f"><label>الاسم بالكامل<input name="name" maxlength="100" required minlength="3" autocomplete="name"></label><label>الهاتف<input name="phone" required inputmode="tel" autocomplete="tel"></label><label>الخدمة<select name="service" required><option value="">اختر الخدمة</option><option>عمرة</option><option>حج</option><option>رحلة داخلية</option><option>فنادق</option><option>طيران</option><option>استفسار آخر</option></select></label><label>موعد السفر المفضل<input name="travel_date" type="date"></label><label>تفاصيل إضافية<textarea name="notes" maxlength="1000" rows="4"></textarea></label><input name="website" autocomplete="off" tabindex="-1" style="position:absolute;left:-10000px" aria-hidden="true"><label class="check"><input name="consent" type="checkbox" required>أوافق على استخدام بياناتي للتواصل بشأن الطلب</label><button id="send">إرسال الطلب</button> <a class="wa" href="https://wa.me/201150337383" target="_blank" rel="noopener noreferrer">واتساب</a><div id="message" role="status" aria-live="polite"></div></form></div><script>
const f=document.getElementById('f'),msg=document.getElementById('message'),b=document.getElementById('send');
f.addEventListener('submit',e=>{e.preventDefault();if(b.disabled)return;let d=Object.fromEntries(new FormData(f));d.consent=f.elements.consent.checked;b.disabled=true;msg.textContent='جارٍ إرسال الطلب...';google.script.run.withSuccessHandler(r=>{b.disabled=false;if(r&&r.ok){msg.textContent='تم تسجيل طلبك بنجاح. رقم الطلب: '+r.id;f.reset()}else msg.textContent='لم يكتمل التسجيل'}).withFailureHandler(err=>{b.disabled=false;msg.textContent='لم يكتمل التسجيل: '+(err.message||'حاول مرة أخرى')}).submitBooking(d)});
</script></body></html>
